# Hostile Takeover CI. Runs the full checks on GitHub's runners so the shared
# VM doesn't have to. Upstream's workflows are disabled on the fork
# (`gh workflow disable`); see "Syncing with upstream OpenFront" in CLAUDE.md.
name: 🧪 HT CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ht-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🔍 Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - run: npm run lint:github
      - run: npm run format:check

  test:
    name: 🔬 Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # `npm test` runs tests/server a second time on its own; mirror that.
  test-server:
    name: 🔬 Test (tests/server alone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npx vitest run tests/server

  # Production bundle: Stage 3 hides modules, and a broken build wouldn't show in tests.
  build:
    name: 🏗️ Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run build-prod

  # The API tests that skip unless HT_TEST_DB=1, against a throwaway Postgres
  # (same image as docker-compose.dev.yml).
  api-db:
    name: 🐘 API tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hostile_takeover
          POSTGRES_USER: hostile_takeover
          POSTGRES_PASSWORD: ci
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U hostile_takeover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HT_TEST_DB: "1"
      HT_DB_HOST: 127.0.0.1
      HT_DB_PORT: "5436"
      HT_DB_NAME: hostile_takeover
      HT_DB_USER: hostile_takeover
      HT_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run api:migrate
      - run: npx vitest run tests/api
