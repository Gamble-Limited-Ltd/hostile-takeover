# Weekly check for OpenFront changes we haven't merged. We follow upstream/main
# (release tags live on release branches like v34, never on main, so a tag can't
# be "merged" here). The run fails when upstream/main has commits our main
# doesn't; the summary lists them and names the newest release tag for context.
# Follow "Syncing with upstream OpenFront" in CLAUDE.md and the ht-upstream-sync skill.
# A second step adds the skill's read-only triage (conflicts, risk flags) to the summary.
name: 🔭 Upstream release watch

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: 🔭 New OpenFront release?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Compare main with upstream
        run: |
          git remote add upstream https://github.com/openfrontio/OpenFrontIO.git
          git fetch --quiet --no-tags upstream main
          tag=$(git ls-remote --tags --refs upstream 'v0.*' | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -1)
          behind=$(git rev-list --count main..upstream/main)
          {
            echo "## Upstream OpenFront"
            echo "- Newest release tag (for context): \`$tag\`"
            echo "- Commits on upstream/main not in our main: **$behind**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$behind" -eq 0 ]; then
            echo "- Up to date with upstream/main. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "- Run the sync checklist in CLAUDE.md. Waiting:"
              echo '```'
              git log --oneline --no-decorate main..upstream/main | head -50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$behind upstream OpenFront commits are not merged into main (newest release $tag)"
            exit 1
          fi
      - name: Triage the newest stable release
        if: always()
        continue-on-error: true
        run: |
          {
            echo
            echo "# Sync triage (.claude/skills/ht-upstream-sync)"
            bash .claude/skills/ht-upstream-sync/scripts/triage.sh
          } >> "$GITHUB_STEP_SUMMARY"
